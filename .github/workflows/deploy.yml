
name: Pick One CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pick-one-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f css/style.css
          test -f js/app.js
          test -f manifest.json
          test -f service-worker.js
          echo "All required files are present!"

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check service-worker.js
          echo "JavaScript syntax is valid!"

      - name: Validate manifest JSON
        run: python -m json.tool manifest.json > /dev/null

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          mkdir _site
          cp index.html manifest.json service-worker.js _site/
          cp -r css js _site/
          if [ -d icons ]; then cp -r icons _site/; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
